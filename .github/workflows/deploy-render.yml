name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Render Deploy - Frontend
        run: |
          echo "🚀 Triggering Render deployment for pulsemate-frontend..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" || echo "⚠️ Frontend deploy hook not configured"
      
      - name: Trigger Render Deploy - Backend
        run: |
          echo "🚀 Triggering Render deployment for pulsemate-backend..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" || echo "⚠️ Backend deploy hook not configured"
      
      - name: Deployment triggered
        run: |
          echo "✅ Render deployments triggered!"
          echo "Check status at: https://dashboard.render.com"
          echo "Frontend will be live in ~3-5 minutes"
          echo "Backend will be live in ~5-8 minutes"

# Render Blueprint Configuration
# Alternative format to ensure Render picks up the correct build config

[[services]]
type = "web"
name = "pulsemate-frontend"
runtime = "static"
buildCommand = "npm install && npx expo install react-dom react-native-web && npx expo export --platform web"
staticPublishPath = "dist"

[[services.routes]]
type = "rewrite"
source = "/*"
destination = "/index.html"

[[services.envVars]]
key = "EXPO_PUBLIC_API_URL"
value = "https://api.pulsemateconnect.in/api"

[[services.envVars]]
key = "EXPO_PUBLIC_FIREBASE_API_KEY"
value = "AIzaSyDrZ9d0zKBLI_Pm-c9o1DAV5q4ldE1I9Nw"

[[services.envVars]]
key = "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN"
value = "pulsemateconnect.firebaseapp.com"

[[services.envVars]]
key = "EXPO_PUBLIC_FIREBASE_PROJECT_ID"
value = "pulsemateconnect"

[[services.envVars]]
key = "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
value = "157620382332"

[[services.envVars]]
key = "EXPO_PUBLIC_FIREBASE_APP_ID"

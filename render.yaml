services:
  # ── Backend API ───────────────────────────────────────────────────────────────
  - type: web
    name: pulsemate-backend
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate resolve --rolled-back 20260725155225_add_clinic_owner_profile || echo "Resolved failed migration" && npx prisma migrate deploy || echo "Migrations deployed" && node prisma/seed-production.js || echo "Seed done" && node scripts/fix-doctor-visibility.js || echo "Doctor visibility fix done"
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # ── Database (Supabase) ──────────────────────────────────────────────────
      # DATABASE_URL  → Transaction pooler port 6543 with pgbouncer=true&connection_limit=1
      # DIRECT_URL    → Session pooler port 5432 (same pooler host, NOT direct db host)
      # Both set manually in Render dashboard (sync: false)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # ── JWT Secrets ─────────────────────────────────────────────────────────
      - key: JWT_ACCESS_SECRET
        sync: false   # set manually in Render dashboard
      - key: JWT_REFRESH_SECRET
        sync: false   # set manually in Render dashboard
      - key: JWT_RESET_SECRET
        sync: false   # set manually in Render dashboard
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: JWT_PHONE_VERIFY_EXPIRY
        value: 30m
      - key: JWT_EMAIL_VERIFY_EXPIRY
        value: 30m
      - key: COOKIE_SECRET
        sync: false   # set manually in Render dashboard
      # ── App URLs ─────────────────────────────────────────────────────────────
      - key: FRONTEND_URL
        value: https://www.pulsemateconnect.in
      - key: BACKEND_URL
        value: https://api.pulsemateconnect.in
      # ── Email (Resend) ───────────────────────────────────────────────────────
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false   # set manually in Render dashboard
      - key: RESEND_FROM_EMAIL
        value: "PulseMate <noreply@pulsemateconnect.in>"
      # ── SMS / OTP (2Factor) ─────────────────────────────────────────────────
      - key: SMS_PROVIDER
        value: twofactor
      - key: TWOFACTOR_API_KEY
        sync: false   # set manually in Render dashboard
      - key: TWOFACTOR_TEMPLATE_NAME
        value: AUTOGEN
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 60
      # ── Firebase ─────────────────────────────────────────────────────────────
      - key: FIREBASE_API_KEY
        value: AIzaSyA2PXJxyIZpYOG2tXHDRu95gaaJogKEDBc
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false   # set manually in Render dashboard
      # ── Cloudinary ───────────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        value: pulsemateconnect
      - key: CLOUDINARY_API_KEY
        sync: false   # set manually in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false   # set manually in Render dashboard
      # ── Razorpay ─────────────────────────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        value: rzp_live_Sz5uowTvIY9Mwv
      - key: RAZORPAY_KEY_SECRET
        sync: false   # set manually in Render dashboard
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false   # set manually in Render dashboard

  # ── Frontend Web ──────────────────────────────────────────────────────────────
  - type: web
    name: pulsemate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.pulsemateconnect.in/api
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyDrZ9d0zKBLI_Pm-c9o1DAV5q4ldE1I9Nw
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: pulsemateconnect.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: pulsemateconnect
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "157620382332"
      - key: VITE_FIREBASE_APP_ID
        value: 1:157620382332:web:e4156f49d8616a4ee6b7f9
      - key: VITE_RAZORPAY_KEY_ID
        value: rzp_live_Sz5uowTvIY9Mwv

# NOTE: Database is hosted on Supabase — no Render-managed database needed.
# Connection strings are set directly in the backend service env vars above.
